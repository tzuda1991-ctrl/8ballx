name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Missing Gradle & Resource Files
        run: |
          # 1. gradle.properties banayein
          printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          # 2. settings.gradle set karein
          printf "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = '8ballx'\ninclude ':app'\n" > settings.gradle

          # 3. Root build.gradle set karein
          printf "plugins {\n    id 'com.android.application' version '8.1.2' apply false\n}\n" > build.gradle

          # 4. Package Name detect karein (Default: com.vip.tz)
          PKG_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || true)
          if [ -z "$PKG_NAME" ]; then
            FIRST_JAVA=$(find app/src/main/java -name "*.java" | head -n 1)
            if [ -n "$FIRST_JAVA" ]; then
              PKG_NAME=$(grep -E "^package " "$FIRST_JAVA" | head -n 1 | sed -E 's/package ([^;]+);/\1/' | tr -d '\r ')
            fi
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.vip.tz"
          fi

          # 5. Missing strings.xml aur styles.xml banayein
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            printf "<resources>\n    <string name=\"app_name\">8BallX</string>\n</resources>\n" > app/src/main/res/values/strings.xml
          fi

          if [ ! -f "app/src/main/res/values/styles.xml" ] && [ ! -f "app/src/main/res/values/themes.xml" ]; then
            printf "<resources>\n    <style name=\"AppTheme\" parent=\"Theme.AppCompat.Light.NoActionBar\" />\n</resources>\n" > app/src/main/res/values/styles.xml
          fi

          # 6. Accessibility XML mein android:flags ko android:accessibilityFlags se fix karein
          if [ -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
            sed -i 's/android:flags=/android:accessibilityFlags=/g' app/src/main/res/xml/accessibility_service_config.xml
          fi

          # 7. Missing launcher icon fix karein
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            if [ ! -d "app/src/main/res/mipmap-hdpi" ] && [ ! -d "app/src/main/res/mipmap-anydpi-v26" ]; then
              sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
              sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
            fi
          fi

          # 8. app/build.gradle banayein
          printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n}\n" > app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
