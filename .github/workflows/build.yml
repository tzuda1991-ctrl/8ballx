name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Missing Gradle Files
        run: |
          # 1. settings.gradle set karein
          printf "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = 'MyApp'\ninclude ':app'\n" > settings.gradle

          # 2. Root build.gradle set karein
          printf "plugins {\n    id 'com.android.application' version '8.1.2' apply false\n}\n" > build.gradle

          # 3. Java file ya Manifest se Package Name nikalein
          PKG_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || true)
          if [ -z "$PKG_NAME" ]; then
            FIRST_JAVA=$(find app/src/main/java -name "*.java" | head -n 1)
            if [ -n "$FIRST_JAVA" ]; then
              PKG_NAME=$(grep -E "^package " "$FIRST_JAVA" | head -n 1 | sed -E 's/package ([^;]+);/\1/' | tr -d '\r ')
            fi
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.example.myapp"
          fi
          echo "Detected Package Name: $PKG_NAME"

          # 4. Missing app/build.gradle banayein
          printf "plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n}\n" > app/build.gradle

          echo "Created app/build.gradle successfully!"
          cat app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
